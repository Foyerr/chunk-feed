<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2340">
<title>Chunk Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600&display=swap">
<style>
/* Layout: one clip at a time, full-height card, thumb-zone buttons at the bottom */
:root{
  --bg:#eef0f5; --surface:#ffffff; --ink:#161b2e; --muted:#5d6480; --line:#d5d9e6;
  --accent:#2f4fb5; --accent-ink:#ffffff; --good:#1f7a55; --bad:#b0412e; --mark:#f3d36b; --gram:#8a4fb0;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --surface:#181c2f; --ink:#e8eaf3; --muted:#9aa1bd; --line:#2a3050;
  --accent:#8ea6ff; --accent-ink:#0f1220; --good:#5cc79a; --bad:#ef8a75; --mark:#6b5a1d; --gram:#d3a6f0; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220; --surface:#181c2f; --ink:#e8eaf3; --muted:#9aa1bd; --line:#2a3050;
  --accent:#8ea6ff; --accent-ink:#0f1220; --good:#5cc79a; --bad:#ef8a75; --mark:#6b5a1d; --gram:#d3a6f0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15px;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
header{display:flex;align-items:center;gap:10px;min-height:40px}
.thread{flex:1;min-width:0;display:flex;flex-direction:column}
.thread b{font-family:var(--display);font-size:20px;line-height:1.1}
.thread span{font-size:12px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding-block:12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.stage>*{flex-shrink:0} /* never squash the card: let the page scroll instead */
.stage>:first-child{margin-top:auto}.stage>:last-child{margin-bottom:auto}
.stage .controls{position:sticky;bottom:0;z-index:2;background:var(--bg);padding-block:8px;margin-block:-8px}
.shot{max-height:34vh}
.stage.menuOpen>:first-child{margin-top:0}
.menuBar{position:sticky;bottom:0;padding-block:10px;background:var(--surface);border-top:1px solid var(--line);margin:0 -20px -20px;padding-inline:20px;border-radius:0 0 18px 18px}
.menuBar button{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.shot{position:relative;aspect-ratio:16/9;max-width:100%;width:100%;background:var(--line);overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.src{position:absolute;left:10px;bottom:8px;right:10px;font-size:11px;color:#fff;text-shadow:0 1px 3px #000a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why{position:absolute;top:8px;left:8px;font-size:11px;padding:3px 8px;border-radius:99px;background:#000a;color:#fff;letter-spacing:.03em}
.body{padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.jp{font-size:24px;line-height:1.9;word-break:break-all}
.jp .t{border-radius:5px;padding:0 1px}
.jp .ch{display:inline-block;cursor:pointer;border-radius:8px;padding:0 3px;margin:2px 1px;border-bottom:2px solid var(--line)}
.jp .ch.fresh{border-bottom-color:var(--accent)}
.jp .ch.hit{color:var(--accent);font-weight:700}
.jp .ch.marked{background:var(--mark)}
.jp .t.c{cursor:pointer;border-bottom:1px dotted transparent}
.jp .t.hit{color:var(--accent);font-weight:700}
.jp .t.marked{background:var(--mark)}
.jp rt{font-size:11px;color:var(--muted)}
.gloss{min-height:20px;font-size:13px;color:var(--muted)}
.gloss a{color:var(--accent)}
.explain{display:flex;flex-direction:column;gap:4px;font-size:14px;border-left:3px solid var(--accent);padding:2px 0 2px 10px}
.explain b{font-weight:700}
.explain span{color:var(--muted)}
.roma{font-size:13px;color:var(--muted);letter-spacing:.02em;margin-top:-6px}
.levels{display:flex;flex-direction:column;gap:8px}
.levels button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.levels button span{font-size:12px;color:var(--muted)}
.levels button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.en{font-size:14px;color:var(--muted);line-height:1.5}
.reveal{align-self:flex-start;background:none;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:10px}
.big{border:none;border-radius:14px;padding:16px 10px;font-size:16px;font-weight:700}
.lost{background:var(--surface);border:1px solid var(--line);color:var(--bad)}
.got{background:var(--accent);color:var(--accent-ink)}
.replay{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:58px}
.hint{text-align:center;font-size:12px;color:var(--muted);min-height:16px}
.flag{background:none;border:none;padding:4px 2px;font-size:12px;color:var(--muted);text-decoration:underline}
.lit{font-size:15px;line-height:1.5;color:var(--ink)}
.en{font-size:13px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.scene{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.scLine{display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.scLine.main{border-color:var(--accent)}
.scLine small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scLine span{font-size:17px;line-height:1.5}
.scLine em{font-style:normal;font-size:12px;color:var(--muted)}
.bdBtn{background:none;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
.breakdown{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.bdRow{display:grid;grid-template-columns:auto 1fr;column-gap:10px;row-gap:2px;align-items:baseline}
.bdRow b{font-size:17px;font-weight:500}
.bdRow span{font-size:13px;color:var(--ink);min-width:0}
.bdRow small{grid-column:1/-1;font-size:12px;color:var(--muted);line-height:1.45}
.bdRow.k-grammar b,.jp .ch.k-grammar{color:var(--gram)}
.jp .ch.k-grammar{border-bottom-style:dotted}
.jp .ch.hasNote{position:relative}
.jp .ch.hasNote::after{content:"";position:absolute;top:2px;right:-1px;width:5px;height:5px;border-radius:50%;background:var(--gram)}
.listen{display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 16px}
.playbig{width:96px;height:96px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-size:34px}
.showtext{align-self:center;background:none;border:1px dashed var(--line);border-radius:8px;padding:8px 14px;font-size:14px;color:var(--muted)}
.lit.wait span{color:var(--muted);font-style:italic}
.lit b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:4px}
.mt{font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:99px;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h1{font-family:var(--display);font-size:28px;margin:0;text-wrap:balance}
.panel h2{font-size:13px;margin:6px 0 0;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.panel p{margin:0;line-height:1.6;color:var(--muted)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:12px}
.danger{color:var(--bad)}
.err{color:var(--bad);font-size:14px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
.stats div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px}
.stats span{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;padding:4px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.chips span.weak{border-color:var(--bad)}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink)}
.check input{width:20px;height:20px}
.loading{text-align:center;color:var(--muted);padding:40px 0}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(8px)}}}
</style>
</head>
<body>
<div class="app">
  <header id="hdr" hidden>
    <div class="thread"><b id="focusLbl">猫</b><span id="stepLbl">Starting out</span></div>
    <div class="count"><span id="todayN">0</span> today</div>
    <button class="iconbtn" id="menuBtn" aria-label="Progress and settings">☰</button>
  </header>

  <main class="stage" id="stage"></main>
</div>

<template id="tplSetup">
  <section class="panel">
    <h1>Chunk Feed</h1>
    <p>Pick a starting word. The feed grows from it one step at a time and quietly brings back what you're forgetting. Show up whenever you like.</p>
    <label for="keyIn">Nadeshiko API key<input id="keyIn" autocomplete="off" placeholder="Paste your key"></label>
    <p style="font-size:12px">Free from your account page on <a href="https://nadeshiko.co" target="_blank" rel="noopener" style="color:var(--accent)">nadeshiko.co</a>. It's only stored in this browser.</p>
    <h2>Where are you starting?</h2>
    <div class="levels" id="levelPick">
      <button data-l="0" aria-pressed="true"><b>Brand new</b><span>Tiny clips, English and readings shown, explains each new piece</span></button>
      <button data-l="1" aria-pressed="false"><b>I know the basics</b><span>Kana and a few hundred words, simple sentences</span></button>
      <button data-l="2" aria-pressed="false"><b>Intermediate</b><span>Around N3: you follow some anime with help</span></button>
    </div>
    <label for="seedIn">Starting word<input id="seedIn" value="猫" lang="ja"></label>
    <label class="check" for="romaIn0"><input type="checkbox" id="romaIn0">I can't read kana yet (show romaji)</label>
    <div class="err" id="setupErr" hidden></div>
    <button class="big got" id="startBtn">Start listening</button>
    <p style="font-size:12px">No account. Your progress lives in this browser; use Copy progress in the menu to move it.</p>
  </section>
</template>

<template id="tplMenu">
  <section class="panel">
    <div class="row" style="align-items:center"><h1 style="flex:3">Progress</h1><button class="ghost" id="closeMenu" style="flex:1">Back</button></div>
    <div class="stats">
      <div><b id="sKnown">0</b><span>known</span></div>
      <div><b id="sWeak">0</b><span>fading</span></div>
      <div><b id="sTotal">0</b><span>clips heard</span></div>
    </div>
    <p id="quotaLine" style="font-size:13px"></p>
    <h2>Thread so far</h2><div class="chips" id="trail"></div>
    <h2>Fading right now</h2><div class="chips" id="fading"></div>
    <h2>Settings</h2>
    <label class="check" for="audioIn"><input type="checkbox" id="audioIn">Audio only (text hidden until you tap Show text)</label>
    <label class="check" for="explIn"><input type="checkbox" id="explIn">Show word explanations under the sentence</label>
    <label class="check" for="furiIn"><input type="checkbox" id="furiIn">Show furigana</label>
    <label class="check" for="romaIn"><input type="checkbox" id="romaIn">Show romaji</label>
    <label for="enIn">English translation<select id="enIn"><option value="auto">Shown until you're comfortable, then on tap</option><option value="always">Always shown</option><option value="tap">Only on tap</option></select></label>
    <label class="check" for="sceneIn"><input type="checkbox" id="sceneIn">Fetch the line before and after each clip (for Hear the scene, and so Gemini knows the context). Uses about 50 extra Nadeshiko requests per deck.</label>
    <label for="deckIn">Clips per deck<select id="deckIn"><option value="50">50</option><option value="100">100</option><option value="150">150</option><option value="200">200</option></select></label>
    <label for="levelIn">Starting level<select id="levelIn"><option value="0">Brand new</option><option value="1">Know the basics</option><option value="2">Intermediate</option></select></label>
    <label for="ratingIn">Content<select id="ratingIn"><option value="SAFE">Safe only</option><option value="SAFE,SUGGESTIVE">Safe + suggestive</option></select></label>
    <label for="newSeed">Start a new thread from a word<input id="newSeed" lang="ja" placeholder="e.g. 約束"></label>
    <button class="ghost" id="seedBtn">Switch thread</button>
    <label for="keyEdit">Nadeshiko API key<input id="keyEdit" autocomplete="off"></label>
    <h2>Meanings and breakdowns (optional)</h2>
    <p style="font-size:13px">Add a Google Gemini key and each deck is sent to Gemini in one request. It returns what each line means in context (with its tone), splits it into chunks, and notes how every verb is conjugated and what each piece of grammar does.</p>
    <label for="gemKeyIn">Gemini API key<input id="gemKeyIn" type="password" autocomplete="off" placeholder="Paste your Gemini key"></label>
    <label for="gemModelIn">Gemini model name<input id="gemModelIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. gemini-2.5-flash"></label>
    <button class="ghost" id="gemTest">Save and translate now</button>
    <p id="gemStatus" style="font-size:13px"></p>
    <div id="gemHist" style="font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums"></div>
    <h2>Backup</h2>
    <div class="row"><button class="ghost" id="exportBtn">Copy progress</button><button class="ghost" id="importBtn">Paste progress</button></div>
    <textarea id="ioBox" hidden rows="4" style="font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px"></textarea>
    <button class="ghost danger" id="resetBtn">Reset everything</button>
    <p id="resetConfirm" hidden><button class="ghost danger" id="resetYes">Yes, erase all progress</button></p>
    <p style="font-size:11px;color:var(--muted)">Version 2026-10-09a</p>
    <div class="menuBar"><button class="big got" id="doneMenu">Done</button></div>
  </section>
</template>

<script>
"use strict";
const API = "https://api.nadeshiko.co/v1/search";
const KEY = "chunkfeed.v1";
const DAY = 864e5;

/* ---------- state ---------- */
function fresh(){return {apiKey:"",settings:{level:0,furi:true,en:"auto",romaji:false,rating:"SAFE"},
  items:{}, seen:{}, cands:{}, bad:{}, thread:null, trail:[], days:{}, total:0}}
let S = load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.items){const f=fresh();s.settings=Object.assign(f.settings,s.settings);return Object.assign(f,s)}}catch(e){}return fresh()}
function save(){
  // keep the seen-clip list bounded
  const ids=Object.keys(S.seen); if(ids.length>4000){ids.sort((a,b)=>S.seen[a]-S.seen[b]).slice(0,ids.length-3500).forEach(i=>delete S.seen[i])}
  const ck=Object.keys(S.cands); if(ck.length>800){ck.sort((a,b)=>S.cands[a]-S.cands[b]).slice(0,ck.length-600).forEach(k=>delete S.cands[k])}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- memory model ----------
   Each word/grammar item has a stability in days. Recall decays as exp(-elapsed/stability).
   Nothing is ever "due": fading items just get a higher chance of being woven into the feed. */
function recall(it){ if(!it||!it.last) return null; return Math.exp(-((Date.now()-it.last)/DAY)/it.s) }
function item(k,label,reading,init){
  let it=S.items[k]; if(!it){it=S.items[k]={k,label,reading:reading||"",s:init,last:0,good:0,bad:0}}
  if(reading&&!it.reading) it.reading=reading; return it }
function strengthen(it,weight){
  const r=it.last?recall(it):0.5;
  it.s=Math.min(365, it.s*(1+weight*(1.2*(1-r)+0.15)) + 0.3*weight);
  it.good++; it.last=Date.now() }
function weaken(it,f){ it.s=Math.max(0.25,it.s*f); it.bad++; it.last=Date.now() }

/* ---------- token analysis ---------- */
const kata2hira=s=>(s||"").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const hasKanji=s=>/[一-龯㐀-䶿々]/.test(s);
function isContent(t){
  if(!t||!t.d) return false;
  if(t.kind==="symbol"||t.kind==="function") return false;
  if(t.pt!==undefined && (t.pt===""||t.pt==="prt")) return false;
  if(/^(助詞|助動詞|補助記号|記号|空白)/.test(t.p||"")) return false;
  return true }
function analyze(seg){
  const toks=(seg.textJa&&seg.textJa.tokens)||[];
  const words=new Map(), grams=new Map();
  toks.forEach(t=>{
    if(isContent(t)) words.set("w:"+t.d,{label:t.d,reading:kata2hira(t.r)});
    if(t.kind==="expression"&&t.d) grams.set("g:"+t.d,{label:t.d});
    else if(!isContent(t)&&t.d&&t.kind!=="symbol"&&(t.pt==="prt"||/^(助詞|助動詞)/.test(t.p||""))) grams.set("g:"+t.d,{label:t.d});
    if(t.inflection&&t.inflection.labels) t.inflection.labels.forEach(l=>grams.set("g:"+l,{label:l}));
  });
  return {toks,words,grams,text:(seg.textJa&&seg.textJa.content)||""} }

/* ---------- levels ----------
   0 = brand new, 1 = knows basics, 2 = intermediate. The level only sets the starting assumptions;
   after that, what you actually understand takes over. */
const LEVELS=[
 {name:"Brand new",assume:0,unseen:1,gram:0.4,len:12},
 {name:"Know the basics",assume:90,unseen:0.8,gram:0.15,len:22},
 {name:"Intermediate",assume:999,unseen:0.4,gram:0,len:40}];
const L=()=>LEVELS[S.settings.level||0];
const coreOf=label=>CORE_BY.get(label);
function solidCount(){let n=0;for(const k in S.items){const it=S.items[k];if(k[0]==="w"&&it.s>7)n++}return n}
function maxLen(){return Math.min(44,L().len+Math.floor(solidCount()/8))}
/* difficulty of a clip: how many things in it are probably new to you */
function difficulty(a,targetKey){
  const lv=L(); let d=0;
  a.words.forEach((v,k)=>{ if(k===targetKey) return; const it=S.items[k];
    if(!it){ const c=coreOf(v.label); d+= (c&&c.rank<lv.assume)?0:lv.unseen }
    else { const r=recall(it); if(it.bad>it.good||r<0.45) d+=1 } });
  a.grams.forEach((v,k)=>{ if(!S.items[k]) d+=lv.gram });
  return d }

/* ---------- Nadeshiko ---------- */
/* Nadeshiko limits each key to a short burst of requests plus a monthly allowance,
   so every call goes through one polite queue, results are kept between visits,
   and each new clip may spend at most two searches. */
const CKEY="chunkfeed.cache";
let cache={}; try{cache=JSON.parse(localStorage.getItem(CKEY))||{}}catch(e){cache={}}
function saveCache(){
  const keys=Object.keys(cache).sort((a,b)=>(cache[b].ts||0)-(cache[a].ts||0));
  keys.slice(30).forEach(k=>delete cache[k]);
  for(let n=Math.min(30,keys.length);n>0;n=Math.floor(n/2)){
    try{localStorage.setItem(CKEY,JSON.stringify(cache));return}catch(e){keys.slice(Math.floor(n/2)).forEach(k=>delete cache[k])} } }
function slim(seg){ // drop fields we never use, to keep the saved cache small
  return {publicId:seg.publicId,episode:seg.episode,mediaPublicId:seg.mediaPublicId,position:seg.position,
    textJa:{content:seg.textJa.content,tokens:seg.textJa.tokens||null},textEn:{content:(seg.textEn&&seg.textEn.content)||"",mt:!!(seg.textEn&&seg.textEn.isMachineTranslated)},
    urls:{imageUrl:seg.urls.imageUrl,audioUrl:seg.urls.audioUrl}} }
class ApiError extends Error{constructor(kind,o={}){super(kind);this.kind=kind;Object.assign(this,o)}}
let queue=Promise.resolve(), lastCall=0, recent=[], netBudget=2;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function api(path,init){
  const run=async()=>{
    const now=Date.now(); recent=recent.filter(t=>now-t<60000);
    if(recent.length>=100) await sleep(60000-(now-recent[0])+500);   // stay under the 150-per-minute burst limit
    const gap=500-(Date.now()-lastCall); if(gap>0) await sleep(gap);
    if(S.quotaOut&&S.quotaOut>Date.now()) throw new ApiError("quota",{detail:""});
    const dk=today(); S.calls=S.calls&&S.calls.d===dk?S.calls:{d:dk,n:0};
    if(S.calls.n>=400) throw new ApiError("daily");   // safety ceiling: a bug can never burn a month of requests
    S.calls.n++; save();
    lastCall=Date.now(); recent.push(lastCall);
    let res;
    try{ res=await fetch("https://api.nadeshiko.co"+path,Object.assign({},init,{headers:Object.assign({"Authorization":"Bearer "+S.apiKey},init&&init.headers)})) }
    catch(e){ throw new ApiError("network") }
    if(res.status===401||res.status===403) throw new ApiError("auth");
    if(res.status===429){
      let j={}; try{j=await res.json()}catch(e){}
      const ra=parseFloat(res.headers.get("Retry-After"));
      const reason=j.code||res.headers.get("X-RateLimit-Reason")||"";
      if(/QUOTA/i.test(reason)){ S.quotaOut=Date.now()+15*60e3; save(); throw new ApiError("quota",{detail:[j.code,j.title,j.detail].filter(Boolean).join(" · ")}) }
      throw new ApiError("burst",{wait:isFinite(ra)?ra:60,detail:[j.code||reason,j.title,j.detail].filter(Boolean).join(" · ")});
    }
    if(!res.ok) throw new ApiError("http",{status:res.status});
    return res.json() };
  const p=queue.then(run,run); queue=p.catch(()=>{}); return p }

/* clips you flag teach the app which episodes (and eventually shows) have off subtitles or timing */
function blocked(seg){ const b=S.bad&&S.bad[seg.mediaPublicId]; if(!b) return false;
  return b.all || (b.eps&&b.eps[seg.episode]>=2) }
function excludeList(){ const out=[];
  for(const id in (S.bad||{})){ const b=S.bad[id];
    if(b.all) out.push({mediaPublicId:id});
    else { const eps=Object.keys(b.eps||{}).filter(e=>b.eps[e]>=2).map(Number); if(eps.length) out.push({mediaPublicId:id,episodes:eps}) } }
  return out.slice(0,40) }
function flagClip(seg){ S.bad=S.bad||{}; const b=S.bad[seg.mediaPublicId]=S.bad[seg.mediaPublicId]||{eps:{},n:0};
  b.eps[seg.episode]=(b.eps[seg.episode]||0)+1; b.n++; if(b.n>=4) b.all=true; save() }
async function search(q,free,mlOverride){
  const ml=mlOverride||maxLen(); let c=cache[q];
  if(!c) c=cache[q]={segs:[],media:{},cursor:null,done:false,ml};
  if(c.ml<ml){ c.ml=ml; c.cursor=null; c.done=false }  // you've grown: allow longer clips from here on
  if(c.done) return c;
  if(!free){ if(netBudget<=0) throw new ApiError("budget"); netBudget-- }
  const body={query:{search:q},take:50,sort:{mode:"RANDOM",seed:hash(q)},include:["media"],
    filters:{contentRating:S.settings.rating.split(","),segmentLengthChars:{min:2,max:ml}}};
  const ex=excludeList(); if(ex.length) body.filters.media={exclude:ex};
  if(c.cursor) body.cursor=c.cursor;
  const j=await api("/v1/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  (j.segments||[]).forEach(sg=>{ if(sg&&sg.textJa&&sg.urls) c.segs.push(slim(sg)) });
  const md=(j.includes&&j.includes.media)||{};
  for(const id in md){ const m=md[id]; c.media[id]={nameJa:m.nameJa,nameEn:m.nameEn} }
  c.cursor=j.pagination&&j.pagination.cursor; c.done=!(j.pagination&&j.pagination.hasMore&&c.cursor);
  c.ts=Date.now(); if(c.segs.length>150) c.segs=c.segs.slice(-150);
  saveCache(); return c }

/* pick the most comprehensible unseen clip for a query */
async function pickClip(q,targetKey,opts={}){
  for(let page=0;page<2;page++){
    let c=cache[q];
    const ml=maxLen(), usable=sg=>!S.seen[sg.publicId]&&!sg._used&&sg.textJa.content.length<=ml&&!blocked(sg);
    const fresh=c&&c.segs.some(usable);
    if(!fresh||page>0){ try{ c=await search(q) }catch(e){ if(e.kind==="budget") return null; throw e } }
    let best=null,bestD=1e9;
    c.segs.forEach(seg=>{
      if(!usable(seg)) return;
      const a=analyze(seg);
      if(opts.needGram && !a.grams.has(opts.needGram)) return;
      if(opts.filter && !opts.filter(a)) return;
      if(opts.minLen && a.text.length<opts.minLen) return;
      const raw=a.toks.length?difficulty(a,targetKey):1.5; // no word breakdown: usable, just less preferred
      const mt=seg.textEn&&seg.textEn.mt?(S.settings.level<2?0.9:0.4):0; // prefer human translations
      const d=Math.abs(raw-0.75)+mt+Math.random()*0.4-(opts.bonus?opts.bonus(a):0); // aim for about one new thing per clip
      if(d<bestD){bestD=d;best={seg,a,media:c.media[seg.mediaPublicId]}}
    });
    if(best){best.seg._used=true;return best}
    if(c.done) return null;
  }
  return null }
function hash(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return Math.abs(h)%100000}

/* ---------- the thread: one chunk at a time, built up step by step ----------
   step 0 anchor: hear the chunk several times
   step 1 context: same chunk, different scenes
   step 2 partner: chunk + a word that keeps showing up next to it
   step 3 grammar: chunk + a grammar form you haven't locked in
   then the partner (or a frequent neighbour) becomes the next focus. */
const STEP_NAMES=["first listens","new scenes","with a partner word","with new grammar"];
function startThread(word){
  const k="w:"+word; item(k,word,"",1.5);
  S.thread={focus:k,step:0,n:0,partner:null,gram:null};
  if(!S.trail.includes(k)) S.trail.push(k); save() }
function threadReady(){ // has the current step done its job?
  const t=S.thread, it=S.items[t.focus];
  const need=[4,5,4,4][t.step];
  if(planning) return t.n>=need;
  return t.n>=need && it && it.good>=Math.min(2+t.step,5) }
function advanceThread(){
  const t=S.thread;
  if(t.step<3){ t.step++; t.n=0; if(t.step===2) t.partner=choosePartner(); return }
  // promote to next focus
  const next=t.partner||choosePartner();
  if(next){ S.thread={focus:next,step:0,n:0,partner:null,gram:null}; if(!S.trail.includes(next)) S.trail.push(next) }
  else { t.step=1; t.n=0 }
}
function choosePartner(){
  // a word that has co-occurred with what you understood, that you don't own yet
  let best=null,bs=-1;
  for(const [k,n] of Object.entries(S.cands)){
    if(S.trail.includes(k)||k[0]==="g") continue;
    const it=S.items[k]; const strong=it&&it.s>20; if(strong) continue;
    const label=k.slice(2); if(label.length<2&&!hasKanji(label)) continue;
    const c=coreOf(label); const coreBonus=(S.settings.level<2&&c)?4*(1-c.rank/CORE.length):0;
    const sc=Math.min(n,6)+(it?0:0.5)+coreBonus+Math.random(); if(sc>bs){bs=sc;best=k}
  }
  if(!best||S.settings.level<2&&!coreOf(best.slice(2))) { const nx=nextCore(); if(nx&&(!best||Math.random()<0.6)) best=nx }
  return best }
function nextCore(){ // the earliest core word you don't own yet
  const lv=L();
  for(const c of CORE){ const k="w:"+c.w; if(S.trail.includes(k)) continue; if(c.rank<lv.assume&&!S.items[k]) continue;
    const it=S.items[k]; if(it&&it.s>10) continue; if(c.w.length<2&&!hasKanji(c.w)) continue; return k }
  return null }

/* ---------- feed planner ---------- */
/* ---------- what goes into a deck ----------
   thread  : the current word, step by step (new scenes, partner word, new grammar)
   grammar : the next point on the child-order ladder, heard in real clips
   combine : two or three chunks you already know, together in one longer sentence
   review  : something that's fading, in a fresh clip
   echo    : an earlier word from the thread
   Early on it's mostly thread + grammar; the more you know, the more of the deck is combinations. */
function knownPool(){ return Object.values(S.items).filter(it=>it.last&&it.good>=2&&(recall(it)||0)>=0.5&&it.bad<=it.good&&(it.k[0]==="w"||it.k[0]==="p"||it.k.startsWith("gp:"))) }
function slotWeights(){
  const k=knownPool().length;
  const combine=k<12?0:Math.min(0.4,0.1+k/400);
  return [["thread",0.38-combine/3],["grammar",0.2],["review",0.17-combine/6],["combine",combine],["echo",0.05]] }
function pickSlot(){ const w=slotWeights(); let r=Math.random()*w.reduce((a,x)=>a+x[1],0);
  for(const [k,v] of w){ r-=v; if(r<=0) return k } return "thread" }
let planI=0;
function fadingItems(){
  return Object.values(S.items).filter(it=>it.last&&it.good>0&&(it.k[0]==="w"||it.k[0]==="p"))
    .map(it=>({it,r:recall(it)})).filter(x=>x.r<0.8).sort((a,b)=>a.r-b.r) }
/* the grammar point you're on: the earliest one in the ladder that isn't solid yet */
function currentPoint(){
  const start=S.settings.level===2?60:S.settings.level===1?20:0;
  for(const p of POINTS){ if(p.rank<start&&!S.items[p.key]) continue;
    const it=S.items[p.key]; if(!it||it.good<4||(recall(it)||0)<0.6) return p }
  return null }
function formOf(p,n){ return p.forms[n%p.forms.length] }
async function grammarClip(tries){
  const p=currentPoint(); if(!p) return null;
  const it=S.items[p.key]; const n=(it?it.good+it.bad:0)+tries;
  // particles alone match almost everything, so pair them with something you know when possible
  let q=formOf(p,n); const pool=knownPool().filter(x=>x.k[0]==="w");
  const short=q.length<=1;
  if(short&&pool.length){ const w=pool[Math.floor(Math.random()*pool.length)]; q=w.label+" "+q }
  const clip=await pickClip(q,p.key,{filter:a=>a.text.includes(formOf(p,n))});
  if(clip){ clip.why="grammar · "+p.name; clip.target=p.key; clip.gp=p.name }
  return clip }
function chunkLabel(it){ if(it.k.startsWith("gp:")){ const p=POINTS.find(x=>x.key===it.k); return p?formOf(p,0):"" } return it.label }
function inClip(a,it){ // is this known chunk in the clip?
  if(it.k.startsWith("gp:")) return a.text.includes(chunkLabel(it));
  return a.words.has(it.k)||a.text.includes(it.label) }
async function combineClip(){
  const pool=knownPool(); if(pool.length<4) return null;
  // one recent or fading chunk + one or two others you know
  pool.sort((x,y)=>(recall(x)||0)-(recall(y)||0)||y.last-x.last);
  const A=pool[Math.floor(Math.random()*Math.min(8,pool.length))];
  const others=pool.filter(x=>x!==A&&!(x.k.startsWith("gp:")&&chunkLabel(x).length<2));
  const B=others[Math.floor(Math.random()*others.length)]; if(!B) return null;
  const known=knownPool().length;

/* the line before and after each clip, fetched while a deck is built */
const XKEY="chunkfeed.ctx";
let ctx={}; try{ctx=JSON.parse(localStorage.getItem(XKEY))||{}}catch(e){ctx={}}
function saveCtx(){ const ks=Object.keys(ctx); if(ks.length>1500) ks.slice(0,ks.length-1200).forEach(k=>delete ctx[k]);
  try{localStorage.setItem(XKEY,JSON.stringify(ctx))}catch(e){} }
function ctxSlim(sg){ return sg&&{publicId:sg.publicId,position:sg.position,textJa:{content:sg.textJa.content},
  textEn:{content:(sg.textEn&&sg.textEn.content)||""},urls:{audioUrl:sg.urls.audioUrl}} }
async function fetchCtx(seg){
  if(ctx[seg.publicId]!==undefined) return;
  try{ const j=await api("/v1/media/segments/"+encodeURIComponent(seg.publicId)+"/context?take=1",{method:"GET"});
    const all=(j.segments||[]).filter(x=>x&&x.publicId!==seg.publicId&&x.textJa&&x.urls);
    const pos=seg.position;
    const before=all.filter(x=>pos==null||x.position<pos).sort((a,b)=>b.position-a.position)[0];
    const after=all.filter(x=>pos==null||x.position>pos).sort((a,b)=>a.position-b.position)[0];
    ctx[seg.publicId]={b:ctxSlim(before)||null,a:ctxSlim(after&&after!==before?after:null)||null};
  }catch(e){ if(e.kind==="daily"||e.kind==="quota"||e.kind==="auth") throw e; ctx[seg.publicId]={b:null,a:null} }
}
let skipGem=false, planning=false, nextDeck=null, deckBuilding=null, deckStatus="", deckGen=0;
const deckSize=()=>S.settings.deck||50;
function setDeckStatus(t){ deckStatus=t; const el=document.getElementById("deckStatus"); if(el) el.textContent=t }
async function buildDeck(){
  const size=deckSize(); let deck=[], err=null;
  const assumed=new Set(); [current,...buffer].forEach(c=>{ if(c&&c.newUnit) assumed.add(c.newUnit) });
  planning=true;
  try{ deck=await planDeck(size,assumed) }catch(e){ err=e } finally{ planning=false }
  if(!deck.length&&err) throw err;
  if(S.settings.scene!==false){ let k=0;
    for(const c of deck){ k++; if(ctx[c.seg.publicId]===undefined){ setDeckStatus("Fetching the lines around each clip: "+k+" of "+deck.length);
        try{ await fetchCtx(c.seg) }catch(e){ break } } }
    saveCtx() }
  if(gemReady()){ setDeckStatus("Translating all "+deck.length+" clips in one request…"); await translateSegs(deck.map(c=>c.seg));
    if(deck.some(c=>!ready2(c.seg))){ await sleep(15000); setDeckStatus("Finishing the last translations…"); await translateSegs(deck.map(c=>c.seg)) } }
  setDeckStatus("");
  return deck }
function ensureNextDeck(){
  if(nextDeck||deckBuilding) return deckBuilding||Promise.resolve(nextDeck);
  const gen=deckGen;
  deckBuilding=buildDeck().then(d=>{ if(gen===deckGen){ nextDeck=d; saveQueue() } return d })
    .finally(()=>{ deckBuilding=null });
  deckBuilding.catch(()=>{});
  return deckBuilding }
function resetDecks(){ deckGen++; buffer=[]; nextDeck=null; saveQueue() }
function preload(c){ const i=new Image(); i.src=c.seg.urls.imageUrl; const a=new Audio(); a.preload="auto"; a.src=c.seg.urls.audioUrl }

function errorText(e){
  const k=e&&(e.kind||e.message);
  if(k==="auth") return "Nadeshiko didn't accept that API key. Open the menu (☰), check the key, and try again.";
  if(k==="quota") return "Nadeshiko says this account is out of requests for the month. Pausing for 15 minutes. If your usage page shows requests left, send this to the developer: "+(e.detail||"no details given");
  if(k==="daily") return "That's 400 Nadeshiko requests today, the app's own safety limit, so your monthly allowance lasts. It starts again tomorrow.";
  if(k==="burst") return "Nadeshiko keeps saying slow down. Wait a few minutes, then try again. ("+(e.detail||"no details")+")";
  if(k==="network") return "Couldn't reach Nadeshiko. Check your connection and try again.";
  return "Nadeshiko returned an error ("+(e.status||k)+"). Try again in a moment."
}

let retryTimer=null, autoResumes=0;
async function showNext(){
  menuOpen=false; stage.classList.remove("menuOpen");
  headerUpdate(); clearInterval(retryTimer);
  if(!buffer.length&&!nextDeck){
    stage.innerHTML='<div class="loading"><p>Getting your next '+deckSize()+' clips ready. This is the only wait; the deck after this one is prepared while you listen.</p><p id="deckStatus"></p></div>';
    setDeckStatus(deckStatus||"Starting…");
    try{ for(let k=0;k<3&&!buffer.length&&!nextDeck;k++) await ensureNextDeck() }catch(e){
      if(e.kind==="burst"){ let left=Math.ceil(Math.max(5,e.wait||60));
        stage.innerHTML='<div class="panel"><p>Nadeshiko asked us to slow down. Picking up again in <b id="cd"></b> seconds.</p></div>';
        $("cd").textContent=left;
        retryTimer=setInterval(()=>{ left--; const el=$("cd"); if(el) el.textContent=left; if(left<=0){clearInterval(retryTimer);showNext()} },1000);
        return }
      stage.innerHTML='<div class="panel"><p class="err"></p><button class="big got" id="retry">Try again</button></div>';
      stage.querySelector(".err").textContent=errorText(e); $("retry").onclick=showNext; return } }
  if(!buffer.length&&nextDeck){ buffer=nextDeck; nextDeck=null }
  if(gemReady()&&!skipGem&&buffer.length&&!ready2(buffer[0].seg)){
    // e.g. cards saved by an older version, or a deck whose translation failed: fix them before showing anything
    const segs=buffer.concat(nextDeck||[]).map(c=>c.seg).filter(sg=>!ready2(sg));
    stage.innerHTML='<div class="loading"><p>Translating '+segs.length+' clips in one request…</p></div>';
    await translateSegs(segs);
    if(!ready2(buffer[0].seg)){
      stage.innerHTML='<div class="panel"><p class="err"></p><button class="big got" id="retry">Try again</button><button class="ghost" id="noGem">Continue without translations for now</button></div>';
      stage.querySelector(".err").textContent="Gemini didn't translate these clips. "+(gemLast&&!/^On\./.test(gemLast)?gemLast:"Open ☰ to see what it sent back.");
      $("retry").onclick=showNext; $("noGem").onclick=()=>{skipGem=true;showNext()}; return } }
  current=buffer.shift(); saveQueue();
  if(!current){ stage.innerHTML='<div class="panel"><p>Couldn\'t find fitting clips for this chunk yet.</p><button class="big got" id="retry">Look again</button><p>Or switch to another starting word in the menu (☰).</p></div>'; $("retry").onclick=showNext; return }
  render(current); headerUpdate(); buffer.slice(0,2).forEach(preload);
  ensureNextDeck(); // the next deck starts building right away
}

function newThingText(c,chunks){ // "先生 「せんせい」 teacher" / "〜よ  telling (emphasis)"
  const k=c.target, x=k.slice(2), sp=unitsOf(c.seg).spans.find(y=>y.k===k);
  const ch=sp&&chunks.find(q=>q.b<sp.e&&q.e>sp.b);
  if(k[0]==="w"){ const cw=coreOf(x); const rd=(cw&&cw.r)||(sp&&sp.r)||"";
    return x+(rd&&rd!==x?" 「"+rd+"」":"")+"  "+((cw&&cw.m)||(ch&&ch.gloss)||"") }
  const l=LADDER_BY.get(x);
  return "〜"+x+"  "+((l&&l.g)||(ch&&(ch.note||ch.gloss))||"grammar") }
function render(c,silent){

  const gpP=c.gp?POINTS.find(x=>x.name===c.gp):null;

  const chunks=chunksOf(seg); let ci=0, cur=null;

  const unitsIn=(b,e)=>[...new Set(U.spans.filter(x=>x.b<e&&x.e>b).map(x=>x.k))];
  const toggle=(keys,el)=>{ if(!keys.length) return; const on=!keys.every(k=>marked.has(k));

  const glossBox=card.querySelector(".gloss");
  function showGloss(head,meaning,lookup){ glossBox.innerHTML=""; glossBox.append(head+(meaning?"  "+meaning:"")+"  ");
    const l=document.createElement("a"); l.href="https://jisho.org/search/"+encodeURIComponent(lookup); l.target="_blank"; l.rel="noopener"; l.textContent="look up"; glossBox.append(l) }
  function holder(pos){ // the chunk span that owns this character, if any
    while(ci<chunks.length&&chunks[ci].e<=pos){ci++;cur=null}

  let pos=0;
  const toks=a.toks.length?a.toks.slice().sort((x,y)=>x.b-y.b):chunks.map(ch=>({s:ch.t,d:"",b:ch.b,e:ch.e,kind:"symbol"}));

    ro.textContent=a.toks.slice().sort((x,y)=>x.b-y.b).filter(t=>t.kind!=="symbol"&&t.r).map(t=>romaji(kata2hira(t.r))).join(" ") }
  // explain the one new thing in this clip, while it's still new to you
  const ex=card.querySelector(".explain"), lines=[];
  const tIt=c.target&&S.items[c.target];

    const rd=cw?cw.r:(tok?kata2hira(tok.r):""); if(cw||S.settings.level<2) lines.push([targetLabel+(rd&&rd!==targetLabel?"  「"+rd+"」":""),cw?cw.m:((tIt&&tIt.gloss)||"tap it for a dictionary link")]) }
  const gk=(c.gram&&a.grams.has(c.gram))?c.gram:null;
  const gList=gk?[gk]:(S.settings.level<2?[...a.grams.keys()].filter(k=>LADDER_BY.has(k.slice(2))&&!(S.items[k]&&S.items[k].good>=3)).slice(0,1):[]);
  gList.forEach(k=>{const l=LADDER_BY.get(k.slice(2)); if(l) lines.push(["〜"+k.slice(2),l.g])});
  if(chunks.length){ lines.length=0;
    const fresh=chunks.filter(ch=>{const it=S.items[ch.key]; return ch.key===c.target||ch.base===targetLabel||!it||it.good<3||it.bad>=it.good})
      .sort((x,y)=>((y.key===c.target||y.base===targetLabel)-(x.key===c.target||x.base===targetLabel))||((x.kind==="word")-(y.kind==="word")));
    const lim=S.settings.level<2?2:1;
    fresh.slice(0,lim).forEach(ch=>lines.push([(ch.kind==="grammar"&&!/^[〜~～]/.test(ch.base)?"〜":"")+ch.base,ch.gloss+(ch.note?" — "+ch.note:"")]));
  }
  if(c.why==="new"&&c.target){ lines.length=0; lines.push(["New",newThingText(c,chunks)]) }
  else if(c.why!=="new") lines.length=0;
  if(S.settings.explain===false) lines.length=0;
  if(lines.length){ ex.hidden=false; lines.forEach(([h,g])=>{const d=document.createElement("div");const b=document.createElement("b");b.textContent=h;const sp=document.createElement("span");sp.textContent="  "+g;d.append(b,sp);ex.append(d)}) }
  // the line before and after: hidden until asked for
  const X=ctx[seg.publicId], scBtn=card.querySelector(".sceneBtn"), sc=card.querySelector(".scene");
  if(X&&(X.b||X.a)){ scBtn.hidden=false;
    const lineRow=(sg,label,isMain)=>{ const r=document.createElement("button"); r.className="scLine"+(isMain?" main":"");
      const l=document.createElement("small"); l.textContent=label; const j=document.createElement("span"); j.lang="ja"; j.textContent=sg.textJa.content;
      r.append(l,j); if(sg.textEn&&sg.textEn.content&&c.enShown){ const e=document.createElement("em"); e.textContent=sg.textEn.content; r.append(e) }
      r.onclick=()=>{ replays+=isMain?1:0; play(sg.urls.audioUrl) }; return r };
    const openScene=()=>{ sc.replaceChildren(); if(X.b) sc.append(lineRow(X.b,"before",false));
      sc.append(lineRow(seg,"this clip",true)); if(X.a) sc.append(lineRow(X.a,"after",false));
      sc.hidden=false; c.sceneOpen=true; scBtn.textContent="Play the scene again" };
    scBtn.onclick=()=>{ openScene(); playChain([X.b,seg,X.a].filter(Boolean).map(x=>x.urls.audioUrl)) };
    if(c.sceneOpen) openScene() }
  const en=card.querySelector(".en"); en.textContent=(gemReady()&&!skipGem?"Subtitle: ":"")+((seg.textEn&&seg.textEn.content)||"(no translation)");

  card.querySelector(".shot").onclick=()=>{replays++;play(seg.urls.audioUrl)};
  if(S.settings.audioOnly&&!c.textShown){

    hint.firstChild.textContent="Listen, then answer. ";
  }
  if(!silent) play(seg.urls.audioUrl);

}
function playChain(urls){ // play the lines one after another, as in the show
  try{ if(audio) audio.pause() }catch(e){}
  let i=0; const next=()=>{ if(i>=urls.length) return; audio=new Audio(urls[i++]); audio.onended=next; audio.play().catch(()=>{}) }; next() }
function play(url){ try{ if(audio){audio.pause()} audio=new Audio(url); audio.play().catch(()=>{}) }catch(e){} }

function answer(ok,already){
  const c=current; if(!c) return;
  S.seen[c.seg.publicId]=Date.now(); S.total++; S.days[today()]=(S.days[today()]||0)+1;
  const u=unitsOf(c.seg), ease=(c.peeked?0.7:1)*(replays>2?0.8:1);
  const touch=(k,init)=>{ const sp=u.spans.find(x=>x.k===k); return item(k,k.slice(2),sp?sp.r:"",init) };
  if(already&&c.target){ const it=touch(c.target,8); it.known=true; it.learnedAt=Date.now(); strengthen(it,1) }
  else{
    // anything you tapped: not known (any more)
    marked.forEach(k=>{ const it=touch(k,1); it.known=false; weaken(it,0.35) });
    u.set.forEach(k=>{ if(marked.has(k)) return; const it=touch(k,2);
      if(k===c.target){
        if(ok){ if(!it.known){ it.known=true; it.learnedAt=Date.now() } strengthen(it,ease) }
        else if(c.why==="new"){ it.known=false; weaken(it,0.5) }
        else weaken(it,0.6) }                     // a review you missed: comes back sooner
      else if(ok&&it.known) strengthen(it,0.3*ease) });
    if(c.why==="new"&&!ok&&c.target){ // didn't land: drop later cards that lean on it, re-plan the next deck
      buffer=buffer.filter(b=>!unitsOf(b.seg).set.has(c.target)); deckGen++; nextDeck=null; saveQueue() }
    if(marked.size){ buffer=buffer.filter(b=>![...marked].some(k=>unitsOf(b.seg).set.has(k))); deckGen++; nextDeck=null; saveQueue() }
  }
  if(c.why==="new"&&c.target) S.lastNew=c.target;
  save(); showNext() }

  api("/v1/user/me",{method:"GET"}).then(j=>{const q=j&&j.quota; const el=$("quotaLine");
    if(q&&el) el.textContent="Nadeshiko requests left this month: "+q.remaining+" of "+q.limit}).catch(()=>{});
  $("furiIn").checked=S.settings.furi; $("romaIn").checked=S.settings.romaji; $("enIn").value=S.settings.en||"auto"; $("levelIn").value=String(S.settings.level||0); $("ratingIn").value=S.settings.rating; $("keyEdit").value=S.apiKey;
  $("furiIn").onchange=e=>{S.settings.furi=e.target.checked;save()};
  $("sceneIn").checked=S.settings.scene!==false; $("sceneIn").onchange=e=>{S.settings.scene=e.target.checked;save()};
  $("deckIn").value=String(deckSize()); $("deckIn").onchange=e=>{S.settings.deck=+e.target.value;save()};
  $("audioIn").checked=!!S.settings.audioOnly; $("explIn").checked=S.settings.explain!==false;
  $("audioIn").onchange=e=>{S.settings.audioOnly=e.target.checked;save()};
  $("explIn").onchange=e=>{S.settings.explain=e.target.checked;save()};
  $("romaIn").onchange=e=>{S.settings.romaji=e.target.checked;save()};
  $("enIn").onchange=e=>{S.settings.en=e.target.value;save()};
  $("levelIn").onchange=e=>{S.settings.level=+e.target.value;resetDecks();save()};
  $("ratingIn").onchange=e=>{S.settings.rating=e.target.value;for(const k in cache)delete cache[k];resetDecks();save()};
  $("gemKeyIn").value=S.gemKey||""; $("gemModelIn").value=S.gemModel||"";
  $("gemStatus").textContent=gemStatus();
  (S.gemHist||[]).slice().reverse().forEach(h=>{ const d=document.createElement("div"); d.textContent=h.t+"  sent "+h.sent+", got back "+h.got+(h.why?"  ("+h.why+")":""); $("gemHist").append(d) });
  $("gemTest").onclick=async()=>{ S.gemKey=$("gemKeyIn").value.trim(); S.gemModel=$("gemModelIn").value.trim().replace(/^models\//,""); gemBackoff=0; gemLast=""; save();
    if(!gemReady()){ $("gemStatus").textContent=gemStatus(); return }
    $("gemStatus").textContent="Asking Gemini…"; const p=gemTranslate(); if(p) await p;
    $("gemStatus").textContent=gemLast||(gemQueue().length?gemStatus():"Nothing waiting to translate yet. Play a clip first.") };
  $("gemKeyIn").onchange=e=>{S.gemKey=e.target.value.trim();gemBackoff=0;save();$("gemStatus").textContent=gemStatus()};
  $("gemModelIn").onchange=e=>{S.gemModel=e.target.value.trim().replace(/^models\//,"");gemBackoff=0;save();$("gemStatus").textContent=gemStatus()};
  $("keyEdit").onchange=e=>{S.apiKey=e.target.value.trim();S.quotaOut=0;S.calls=null;save()};
  $("seedBtn").onclick=()=>{const w=$("newSeed").value.trim(); if(!w) return; S.seedWords=[w]; startThread(w); resetDecks(); current=null; showNext()};
  $("exportBtn").onclick=async()=>{const box=$("ioBox"),d=JSON.stringify(Object.assign({},S,{apiKey:"",gemKey:""})); box.hidden=false; box.value=d;
    try{await navigator.clipboard.writeText(d);$("exportBtn").textContent="Copied"}catch(e){box.select()}};
  $("importBtn").onclick=()=>{const box=$("ioBox"); if(box.hidden||!box.value){box.hidden=false;box.value="";box.placeholder="Paste a backup here, then tap Paste progress again";return}
    try{const d=JSON.parse(box.value); if(!d.items) throw 0; const key=S.apiKey,gk=S.gemKey,gm=S.gemModel; S=Object.assign(fresh(),d); S.apiKey=key; S.gemKey=gk; S.gemModel=gm||d.gemModel; save(); $("importBtn").textContent="Restored"; resetDecks()}catch(e){$("importBtn").textContent="That backup didn't parse"}};
  $("resetBtn").onclick=()=>{$("resetConfirm").hidden=false};
  $("resetYes").onclick=()=>{const key=S.apiKey,gk=S.gemKey,gm=S.gemModel; S=fresh(); S.apiKey=key; S.gemKey=gk; S.gemModel=gm; save(); try{localStorage.removeItem(LKEY);localStorage.removeItem(QKEY)}catch(e){} lit={}; resetDecks(); current=null; setup()};
  $("doneMenu").onclick=()=>$("closeMenu").click();
  $("closeMenu").onclick=()=>{ menuOpen=false; stage.classList.remove("menuOpen"); stage.scrollTop=0;
    const gk=$("gemKeyIn").value.trim(), gm=$("gemModelIn").value.trim().replace(/^models\//,"");
    if(gk!==(S.gemKey||"")||gm!==(S.gemModel||"")){ S.gemKey=gk; S.gemModel=gm; gemBackoff=0; gemLast=""; save() }
    gemPump();
    if(!S.thread) return setup(); if(current){render(current);headerUpdate()} else showNext() };
}
$("menuBtn").onclick=menu;

if(!S.apiKey||!S.thread) setup(); else { $("hdr").hidden=false; loadQueue(); showNext() }
</script>
</body>
</html>
